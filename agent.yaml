spec_version: "0.1.0"
name: git-cartabandon
version: 1.0.0
description: "Autonomous E-Commerce Cart Abandonment Diagnostic, Margin-Preserving Recovery Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - checkout-funnel-analytics
  - margin-preserving-promotions

tools:
  - funnel-dropoff-diagnostic
  - exit-intent-discount-engine
  - cart-recovery-scheduler

runtime:
  max_turns: 50
  timeout: 120

tags:
  - retail-ecommerce
  - cart-abandonment
  - checkout-optimization
  - conversion-rate
  - passport-challenge

metadata:
  passport_id: "aps-cartabandon-01"
  passport_category: "Retail & e-commerce"
